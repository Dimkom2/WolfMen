<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Messenger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loading-page" class="page">
        <div class="loading-container">
            <img src="wolf-logo.png" alt="Wolf Logo" class="loading-logo">
            <div class="loading-text">Wolf Messenger</div>
            <div class="loading-bar-container">
                <div class="loading-bar-background"></div>
                <div class="loading-bar-progress" id="loadingBar"></div>
            </div>
            <div class="loading-subtext" id="loadingStatus">Подключение к серверу...</div>
        </div>
    </div>

    <!-- Страница входа -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <img src="wolf-logo.png" alt="Wolf Logo" class="login-logo">
            <div class="input-group">
                <input type="text" id="login" placeholder="ЛОГИН" class="login-input">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="ПАРОЛЬ" class="login-input">
            </div>
            <button onclick="checkPassword()" class="login-button">ВОЙТИ В СТАЮ</button>
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="app" class="page">
        <!-- Секция сообщений -->
        <div id="messages-section" class="section active">
            <div class="contacts-panel">
                <div class="panel-header">
                    <div class="logo">
                        <img src="wolf-logo.png" alt="Wolf" class="wolf-logo-small">
                        <span>WOLF PACK</span>
                    </div>
                </div>
                <div class="contacts-list" id="contactsList">
                    <div class="loading">Загрузка контактов...</div>
                </div>
                <div class="user-profile">
                    <div class="profile-avatar" id="currentUserAvatar">?</div>
                    <div class="profile-info">
                        <div class="profile-name" id="currentUserName">Не авторизован</div>
                        <div class="profile-status" id="currentUserStatus">offline</div>
                    </div>
                </div>
            </div>

            <div class="chat-window">
                <div class="chat-header">
                    <div class="header-back" onclick="goBack()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="chat-partner">
                        <div class="partner-avatar" id="partnerAvatar">?</div>
                        <div class="partner-info">
                            <div class="partner-name" id="partnerName">Выберите чат</div>
                            <div class="partner-status" id="partnerStatus">offline</div>
                        </div>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message">
                        <img src="wolf-logo.png" alt="Wolf" class="welcome-logo">
                        <div class="welcome-text">Wolf Messenger</div>
                        <div class="welcome-subtext">Войдите в систему для начала работы</div>
                    </div>
                </div>
                <div class="input-container">
                    <div class="message-input-wrapper">
                        <input type="text" class="message-input" id="messageInput" placeholder="Напишите сообщение..." disabled>
                        <button class="send-button" onclick="sendMessage()" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Секция профиля -->
        <div id="profile-section" class="section">
            <div class="profile-page">
                <div class="profile-header">
                    <div class="profile-avatar-large" id="profileAvatar">?</div>
                    <h2 id="profileName">Имя пользователя</h2>
                    <div class="profile-login" id="profileLogin">@login</div>
                    <div class="profile-role" id="profileRole">Пользователь</div>
                </div>
                <div class="profile-coins">
                    <div class="coins-label">WOLF COINS</div>
                    <div class="coins-amount" id="profileCoins">0</div>
                </div>
                <div class="profile-actions">
                    <button class="profile-btn" onclick="showChangePasswordModal()">Сменить пароль</button>
                    <button class="profile-btn logout" onclick="logout()">Выйти</button>
                </div>
                <div class="profile-version">Wolf Messenger v2.0</div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <button class="nav-btn active" data-tab="messages" onclick="switchTab('messages')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>Сообщения</span>
            </button>
            <button class="nav-btn" data-tab="profile" onclick="switchTab('profile')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Профиль</span>
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCzrpmm4ewVhq6-dmkr4i0xiGqqPSkNFZw",
            authDomain: "wolf-messendger.firebaseapp.com",
            projectId: "wolf-messendger",
            storageBucket: "wolf-messendger.firebasestorage.app",
            messagingSenderId: "454406992399",
            appId: "1:454406992399:web:866c45d70ea30236a7297a"
        };

        function updateLoadingProgress(progress, status) {
            const loadingBar = document.getElementById('loadingBar');
            const loadingStatus = document.getElementById('loadingStatus');
            if (loadingBar) loadingBar.style.width = progress + '%';
            if (loadingStatus) loadingStatus.textContent = status;
        }

        updateLoadingProgress(10, 'Инициализация Firebase...');
        
        if (typeof firebase === 'undefined') {
            console.error('Firebase не загружен');
            updateLoadingProgress(100, 'Ошибка загрузки Firebase');
        } else {
            try {
                firebase.initializeApp(firebaseConfig);
                updateLoadingProgress(40, 'Firebase подключен');
                console.log('✅ Firebase инициализирован');
            } catch (error) {
                console.error('❌ Ошибка инициализации Firebase:', error);
                updateLoadingProgress(100, 'Ошибка подключения');
            }
        }

        setTimeout(() => {
            updateLoadingProgress(70, 'Загрузка приложения...');
            const script = document.createElement('script');
            script.src = 'script.js';
            script.onload = function() {
                updateLoadingProgress(100, 'Готово!');
                setTimeout(() => {
                    if (window.initApp) window.initApp();
                }, 500);
            };
            script.onerror = function() {
                updateLoadingProgress(100, 'Ошибка загрузки приложения');
                console.error('Ошибка загрузки script.js');
            };
            document.head.appendChild(script);
        }, 1000);
    </script>
</body>
</html>
